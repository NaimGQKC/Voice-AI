[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resto-voice-agent"
version = "0.1.0"
description = "Bilingual (FR/EN) voice AI phone agent for a restaurant (Montreal), built on LiveKit Agents with a swappable Libro reservation backend."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "Apache-2.0" }

# Core dependencies: the reservation layer + mock Libro server.
# These are light and are all that the test suite needs.
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# The voice agent runtime. Heavier (pulls the turn-detector model etc.).
# Install with:  pip install -e ".[agent]"
agent = [
    # VAD is bundled in AgentSession and turn detection is hosted, so the
    # silero / turn-detector plugins (deprecated upstream) are not needed.
    "livekit-agents[deepgram,openai,google]>=1.6.4",
    "livekit-plugins-noise-cancellation>=0.2",
    "python-dotenv>=1.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
resto-mock-libro = "mock_libro.__main__:main"

# `resto_agent` lives under src/; `mock_libro` lives at the repo root (it
# represents an *external* service). Both are importable after `pip install -e .`.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["resto_agent*", "mock_libro*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
